# Requires cert-manager and a pre-created DNS01 ClusterIssuer named platform-dns01.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: public-tls
  namespace: infra-gateway
spec:
  secretName: public-tls
  dnsNames: [api.example.internal]
  issuerRef:
    kind: ClusterIssuer
    name: platform-dns01
