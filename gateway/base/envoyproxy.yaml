# Both fleets are independent; external LoadBalancer implementation must be supplied by platform.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: public-proxy
  namespace: infra-gateway
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 3
        container:
          resources:
            requests: {cpu: "2", memory: 2Gi}
            limits: {cpu: "6", memory: 8Gi}
      envoyService:
        type: LoadBalancer
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: internal-proxy
  namespace: infra-gateway
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        container:
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {cpu: "4", memory: 4Gi}
      envoyService:
        type: LoadBalancer
