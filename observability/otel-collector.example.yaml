# Requires OTel Collector distribution with otlp receivers + OTLP exporter; endpoints adjusted for environment.
apiVersion: v1
kind: ConfigMap
metadata: {name: gateway-otel-config, namespace: monitoring}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: 512
      batch: {}
    exporters:
      otlp:
        endpoint: otel-gateway.monitoring.svc.cluster.local:4317
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp]
