# TLS certificate and CA Secret must be created by PKI controller before apply.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata: {name: partner-mtls, namespace: infra-gateway}
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: partner-gateway}
  tls:
    clientValidation:
      caCertificateRefs:
        - {group: "", kind: Secret, name: partner-client-ca}
