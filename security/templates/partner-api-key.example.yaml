# Must create Secret using external secrets; v1.9 API Key policy schema must be server-side validated.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: partner-api-key
  namespace: ads
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ads-partner-api
  apiKeyAuth:
    credentialRefs:
      - group: ""
        kind: Secret
        name: partner-api-key
