apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata: {name: cors-example, namespace: ads}
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: ads-public-api}
  cors:
    allowOrigins: [https://console.example.internal]
    allowMethods: [GET, POST, OPTIONS]
    allowHeaders: [authorization, content-type]
