apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata: {name: ads-local-limit, namespace: ads}
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: ads-public-api}
  rateLimit:
    local:
      rules:
        - limit: {requests: 100, unit: Second}
