apiVersion: apps/v1
kind: Deployment
metadata: {name: ratelimit-redis, namespace: infra-gateway}
spec:
  replicas: 1
  selector: {matchLabels: {app: ratelimit-redis}}
  template:
    metadata: {labels: {app: ratelimit-redis}}
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports: [{containerPort: 6379}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata: {name: ratelimit-redis, namespace: infra-gateway}
spec:
  selector: {app: ratelimit-redis}
  ports: [{name: redis, port: 6379, targetPort: 6379}]
